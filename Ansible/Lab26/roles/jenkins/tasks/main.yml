---
# The VM is not registered with Red Hat, so Java comes from the RHEL DVD
- name: Add the RHEL DVD repos
  ansible.builtin.yum_repository:
    name: "rhel-dvd-{{ item | lower }}"
    description: "RHEL 10 DVD {{ item }}"
    baseurl: "file://{{ rhel_dvd }}/{{ item }}"
    gpgcheck: true
    gpgkey: "{{ redhat_key }}"
  loop: [BaseOS, AppStream]

- name: Add the Jenkins repo
  ansible.builtin.yum_repository:
    name: jenkins
    description: Jenkins-stable
    baseurl: https://pkg.jenkins.io/rpm-stable
    gpgcheck: true
    gpgkey: https://pkg.jenkins.io/rpm-stable/repodata/repomd.xml.key

- name: Install Java 21 and fontconfig (needed by Jenkins)
  ansible.builtin.dnf:
    name: [java-21-openjdk-headless, fontconfig]
    state: present
    disablerepo: "*"
    enablerepo: [rhel-dvd-baseos, rhel-dvd-appstream]

- name: Install Jenkins
  ansible.builtin.dnf:
    name: jenkins
    state: present
    disablerepo: "*"
    enablerepo: jenkins

# worker1 has little free RAM, so cap the Java heap and allow a slow start
- name: Create the Jenkins service override folder
  ansible.builtin.file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    mode: "0755"

- name: Limit Jenkins memory
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins.service.d/override.conf
    content: |
      [Service]
      Environment="JAVA_OPTS=-Djava.awt.headless=true -Xmx256m"
      TimeoutStartSec=600
    mode: "0644"

- name: Start and enable Jenkins
  ansible.builtin.systemd_service:
    name: jenkins
    state: started
    enabled: true
    daemon_reload: true
