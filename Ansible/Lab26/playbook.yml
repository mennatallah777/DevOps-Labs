---
- name: Install Docker, kubectl and Jenkins using roles
  hosts: managed
  become: true

  roles:
    - docker
    - kubectl
    - jenkins

  post_tasks:
    - name: Check Docker
      ansible.builtin.command: docker --version
      register: docker_out
      changed_when: false

    - name: Check kubectl
      ansible.builtin.command: kubectl version --client
      register: kubectl_out
      changed_when: false

    - name: Check that Jenkins answers on port 8080
      ansible.builtin.uri:
        url: http://localhost:8080/login
        status_code: 200
      register: jenkins_out
      retries: 30
      delay: 10
      until: jenkins_out.status == 200

    - name: Show results
      ansible.builtin.debug:
        msg:
          - "{{ docker_out.stdout }}"
          - "{{ kubectl_out.stdout_lines[0] }}"
          - "Jenkins {{ jenkins_out.x_jenkins | default('') }} is up: HTTP {{ jenkins_out.status }}"
