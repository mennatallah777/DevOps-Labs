---
- name: Install MySQL server and the Python MySQL driver
  ansible.builtin.dnf:
    name: [mysql8.4-server, python3-PyMySQL]
    state: present
    disablerepo: "*"
    enablerepo: [rhel-dvd-baseos, rhel-dvd-appstream]

- name: Start and enable MySQL
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: true

- name: Create the ivolve database
  ansible.mysql.mysql_db:
    name: "{{ mysql_db_name }}"
    state: present
    login_unix_socket: /var/lib/mysql/mysql.sock

# MySQL 8.4 turns off the old mysql_native_password plugin,
# so the user gets the default caching_sha2_password plugin
- name: Create ivolveuser with all privileges on the ivolve database
  ansible.mysql.mysql_user:
    name: "{{ mysql_user }}"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ mysql_password }}"
    host: localhost
    priv: "{{ mysql_db_name }}.*:ALL"
    state: present
    login_unix_socket: /var/lib/mysql/mysql.sock
  no_log: true
